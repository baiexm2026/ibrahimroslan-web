<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ujian 3D - Perspektif Dunia | Ibrahim Roslan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; 
            color: #2d3748;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        #canvas-container {
            width: 100%;
            height: 55vh;
            position: relative;
            background: #ffffff;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        .content-box {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 25px;
            text-align: center;
        }

        .title {
            font-size: 1.3em;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9em;
            color: #718096;
            line-height: 1.6;
        }

        .instruction {
            margin-top: 15px;
            font-size: 0.8em;
            color: #3182ce;
            font-weight: 600;
        }
    </style>

    <!-- Skrip Three.js & OrbitControls Versi Stabil & Serasi -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content-box">
        <div class="title">Sudut Pandang & Perspektif</div>
        <div class="subtitle">
            Dunia bergerak mengikut paksinya. Di satu sudut ada kepanasan, di sudut lain ada kedinginan. Begitu juga kehidupan — perbezaan pandangan bergantung kepada sudut mana kita berdiri.
        </div>
        <div class="instruction">👈 Usap skrin / Klik & Drag untuk memusingkan dunia 👉</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        
        // 1. Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // 2. Camera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 4. Controls (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;

        // 5. Geometry (Bumi) & Material (Pembetulan Hex Color: 0xcbd5e0)
        const geometry = new THREE.IcosahedronGeometry(1.4, 6);
        const material = new THREE.MeshStandardMaterial({
            color: 0xcbd5e0,
            roughness: 0.3,
            metalness: 0.1,
            flatShading: true
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // 6. Pencahayaan
        const warmLight = new THREE.DirectionalLight(0xff6600, 2.5);
        warmLight.position.set(5, 3, 2);
        scene.add(warmLight);

        const coolLight = new THREE.DirectionalLight(0x0088ff, 2.5);
        coolLight.position.set(-5, -3, -2);
        scene.add(coolLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // 7. Render Loop
        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.002;
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();

        // 8. Responsif Saiz Skrin
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>

</body>
</html>
