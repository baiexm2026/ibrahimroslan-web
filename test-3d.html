<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ujian 3D - Perspektif Dunia | Ibrahim Roslan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff; 
            color: #2d3748;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Container Visual 3D */
        #canvas-container {
            width: 100%;
            height: 60vh; /* Mengambil 60% tinggi skrin mobile */
            position: relative;
            background: #ffffff;
        }

        /* Mesej Kad Bawah Canvas */
        .content-box {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 25px;
            text-align: center;
        }

        .title {
            font-size: 1.3em;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.9em;
            color: #718096;
            line-height: 1.6;
        }

        .instruction {
            margin-top: 15px;
            font-size: 0.8em;
            color: #3182ce;
            font-weight: 600;
        }
    </style>

    <!-- Import Three.js & OrbitControls dari CDN Percuma -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Ruang Paparan 3D -->
    <div id="canvas-container"></div>

    <!-- Teks Penerangan Perspektif -->
    <div class="content-box">
        <div class="title">Sudut Pandang & Perspektif</div>
        <div class="subtitle">
            Dunia bergerak mengikut paksinya. Di satu sudut ada kepanasan, di sudut lain ada kedinginan. Begitu juga kehidupan — perbezaan pandangan bergantung kepada sudut mana kita berdiri.
        </div>
        <div class="instruction">👈 Usap skrin menggunakan jari untuk memusingkan dunia 👉</div>
    </div>

    <!-- Skrip Teras Three.js -->
    <script>
        // 1. Persediaan Scene, Camera & Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // Latar belakang putih kekal

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimasi untuk skrin mobile Retina
        container.appendChild(renderer.domElement);

        // 2. Kawalan Sentuhan Jari (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; // Matikan zoom supaya skrin mobile tak terganggu apabila di-scroll

        // 3. Pembinaan Sfera 3D (Bumi Geometri)
        const geometry = new THREE.IcosahedronGeometry(1.5, 12); // Sfera berstuktur moden
        const material = new THREE.MeshStandardMaterial({
            color: #e2e8f0,
            roughness: 0.4,
            metalness: 0.1,
            flatShading: true // Memberi tekstur bucu poli untuk gaya artistik
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // 4. Pencahayaan Bermesej (Panas vs Sejuk)
        
        // Cahaya Warm (Panas/Oren) dari Sisi Kanan
        const warmLight = new THREE.DirectionalLight(0xff7700, 2.2);
        warmLight.position.set(5, 3, 2);
        scene.add(warmLight);

        // Cahaya Cool (Sejuk/Biru) dari Sisi Kiri
        const coolLight = new THREE.DirectionalLight(0x0088ff, 2.2);
        coolLight.position.set(-5, -3, -2);
        scene.add(coolLight);

        // Cahaya Ambiens Lembut (Kekalkan Kecerahan Putih)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // 5. Animasi Putaran Perlahan Automatik
        function animate() {
            requestAnimationFrame(animate);
            
            // Bumi berputar perlahan secara automatik jika tidak diusik jari
            globe.rotation.y += 0.002;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 6. Khas Untuk Responsif Saiz Skrin Telefon / Desktop
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>

</body>
</html>
